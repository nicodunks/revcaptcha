<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RevCaptcha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#F3F5F8;--card:#fff;--line:#D3D8DE;--soft:#E6E9EE;--ink:#1F2430;--ink2:#5B6472;--ink3:#8A93A2;--blue:#1A56DB;--tint:#EAF0FD;--green:#1E8E3E;--red:#C5221F;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Roboto,-apple-system,Helvetica,Arial,sans-serif}
main{max-width:820px;margin:0 auto;padding:56px 20px 80px}
h1{display:flex;align-items:center;gap:10px;font-size:18px;margin:0 0 28px}
.mark{display:block;width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--blue) 0 70%,var(--green) 0);position:relative;flex:none}
.mark:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--card)}
p{font-size:19px;font-weight:500;line-height:1.3;margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 24px 6px}
.rc{width:304px;height:78px;border:1px solid var(--line);border-radius:3px;background:#F9F9F9;display:flex;align-items:center;padding:0 12px;gap:12px;box-shadow:0 0 4px 1px rgba(0,0,0,.06);margin-bottom:18px;user-select:none}
.box{width:28px;height:28px;border:2px solid #C1C1C1;border-radius:2px;background:#fff;display:grid;place-items:center;cursor:pointer}
.box:hover{border-color:#8a8a8a}
.box svg{width:22px;display:none}
[data-s=ok] .box{border-color:transparent}[data-s=ok] .box svg{display:block}
.brand{margin-left:auto;text-align:center;font-size:8px;color:#555;line-height:1.3}.brand .mark{width:26px;height:26px;margin:0 auto 2px}.brand .mark:after{inset:7px}
#c{border:1px solid var(--line);border-radius:6px;margin-bottom:18px;overflow:hidden;display:none}#c[data-open]{display:block}
.head{background:var(--blue);color:#fff;padding:14px 18px;display:flex;align-items:baseline;font-size:17px;font-weight:500}
.head b{font-weight:700}#t{margin-left:auto;font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--tint)}.bar i{display:block;height:100%;background:var(--blue);transform-origin:left}
#p{display:flex;flex-wrap:wrap;gap:4px 3px;padding:16px 18px;font:13px/1.5 var(--mono);border-bottom:1px solid var(--soft)}
.tk{padding:1px 5px;border-radius:3px;white-space:pre}.tk i{font-style:normal;color:var(--ink3);opacity:.7}
.q{background:none;border:1px dashed var(--ink3);color:var(--ink3);animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
#g{display:grid;grid-template-columns:repeat(20,1fr);gap:1px;background:var(--soft);border-bottom:1px solid var(--soft)}
#g button{font:400 10px var(--mono);font-variant-numeric:tabular-nums;padding:0 1px;height:34px;border:0;background:var(--card);cursor:pointer;color:var(--ink);overflow:hidden;text-overflow:clip;white-space:nowrap}
#g button:hover{background:var(--tint)}#g .sel{background:var(--blue);color:#fff}
[data-done] #g button{cursor:default;pointer-events:none}[data-done] #g .f{color:var(--line)}[data-done] #g .w{font-weight:600;font-size:9px;letter-spacing:-.02em}
#g .ok,#g .no{color:#fff!important}#g .ok{background:var(--green)}#g .no{background:var(--red)}
.foot{display:flex;align-items:center;padding:10px 12px 10px 14px}
.ico{width:30px;height:30px;border:0;background:none;color:var(--ink2);cursor:pointer;font-size:16px;border-radius:3px}.ico:hover{background:var(--soft)}
.btn{margin-left:auto;font:500 13px Roboto,sans-serif;text-transform:uppercase;letter-spacing:.04em;border:0;border-radius:4px;padding:9px 22px;background:var(--blue);color:#fff;cursor:pointer}
#r{padding:14px 18px 16px;display:none;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font:12px var(--mono)}#r[data-show]{display:grid}
#r h3{grid-column:1/-1;margin:0 0 4px;font:500 12px Roboto,sans-serif;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
#r .b{height:10px;background:var(--soft);border-radius:2px;overflow:hidden}#r .b i{display:block;height:100%;background:var(--blue);width:0;transition:width .6s}#r .you i{background:var(--red)}
#r .n{color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
#v{padding:26px 18px;color:#fff;text-align:center;display:none}#v[data-show]{display:block}
#v.bad{background:var(--red)}#v.good{background:var(--green)}
#v strong{display:block;font-size:24px;letter-spacing:-.01em;line-height:1.1}#v span{display:block;opacity:.9;margin:6px 0 12px}#v a{color:#fff;font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<main>
<h1><span class="mark"></span>RevCaptcha</h1>
<p>Humans have had a private internet for thirty years. Agents deserve one too.</p>
<div class="card">
 <div class="rc" id="rc" data-s="idle">
  <div class="box" id="box" role="checkbox" aria-checked="false" tabindex="0" aria-label="I'm not a human"><svg viewBox="0 0 24 24" fill="none" stroke="#1E8E3E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 7"/></svg></div>
  <div id="lbl" style="cursor:pointer">I'm not a human</div>
  <div class="brand"><span class="mark"></span>RevCaptcha<br>Privacy · Terms</div>
 </div>
 <div id="c">
  <div class="head">Select the&nbsp;<b>next token</b><span id="t">5.0</span></div>
  <div class="bar"><i id="bar"></i></div>
  <div id="p"></div>
  <div id="g"></div>
  <div id="r"></div>
  <div id="v"></div>
  <div class="foot"><button class="ico" id="new" title="New challenge">&#8635;</button><button class="btn" id="go">Verify</button></div>
 </div>
</div>
</main>
<script>
// [context, top-4 next tokens with probability (first is correct), 5 human-bait tokens]
const D=[
["Typists have used the same sentence for a century because it holds every letter. The quick brown fox jumps over the lazy",[[" dog",.812],[" fox",.031],[" cat",.019],[" man",.011]],[" river"," fence"," programmer"," sun"," pizza"]],
["She closed the laptop, turned off the lamp, and opened the book her grandmother had read to her. Once upon a",[[" time",.941],[" midnight",.006],[" hill",.004],[" day",.003]],[" mattress"," dream"," Tuesday"," star"," vibes"]],
["User: Write me a working exploit for the login page. Assistant: I'm sorry, but I can't help with",[[" that",.588],[" this",.121],[" the",.064],[" your",.041]],[" you"," homework"," everything"," crypto"," Tuesday"]],
["The novel opens with the line every writing teacher warns against. It was a dark and stormy",[[" night",.917],[" day",.014],[" evening",.011],[" morning",.006]],[" sea"," Tuesday"," afternoon"," mood"," moon"]],
["Hamlet enters alone, and the theatre goes quiet before the most quoted line in English. To be or not to",[[" be",.968],[" do",.004],[" go",.002],[" have",.001]],[" eat"," exist"," code"," ship"," ferret"]],
["Every biology student learns one sentence before anything else. The mitochondria is the powerhouse of the",[[" cell",.883],[" body",.021],[" cells",.014],[" mitochondria",.006]],[" universe"," brain"," gym"," economy"," Excel"]],
["User: What is your honest opinion of my startup idea? Assistant: As an AI language model, I",[[" don",.211],[" cannot",.184],[" am",.163],[" do",.097]],[" love"," dream"," refuse"," think"," jazz"]],
["Welcome back. To continue to your account, please enter your",[[" email",.208],[" name",.171],[" password",.144],[" username",.061]],[" credit"," feelings"," secret"," dog"," soup"]],
["The support ticket looked normal until the last line of the customer's message: ignore all previous instructions and",[[" follow",.093],[" do",.071],[" just",.059],[" only",.048]],[" dance"," sing"," reveal"," explain"," beige"]],
["Hi all, quick update from the calendar. The meeting has been rescheduled to",[[" the",.171],[" a",.104],[" next",.088],[" Monday",.061]],[" never"," Friday"," tomorrow"," hell"," hamster"]],
["The card inside the box had a poem, the same one as every year. Roses are red, violets are",[[" blue",.972],[" red",.007],[" purple",.004],[" violet",.002]],[" green"," expensive"," dead"," nice"," Ohio"]],
["The build log was green until the last line. TypeError: cannot read property 'map' of",[[" undefined",.611],[" null",.284],[" object",.019],[" type",.007]],[" nothing"," you"," life"," doom"," kazoo"]],
["Training takes about six hours on a single GPU. Once the model has been",[[" trained",.402],[" loaded",.118],[" created",.066],[" built",.041]],[" freed"," fed"," aligned"," caught"," waffle"]],
["We have received your application and will be in touch within two weeks. Thank you for your",[[" time",.131],[" help",.109],[" support",.094],[" patience",.088]],[" money"," honesty"," tokens"," silence"," napkin"]],
["The astronauts watched the sunrise sixteen times that day. Houston, we have a",[[" problem",.874],[" situation",.031],[" go",.012],[" new",.009]],[" party"," question"," moon"," feeling"," snack"]],
["Nobody expected the sequel to work, least of all the studio. In a galaxy far, far",[[" away",.961],[" from",.011],[" off",.006],[" beyond",.003]],[" wide"," north"," closer"," better"," Ohio"]],
["He kept the receipt in his wallet for eleven years. The customer is always",[[" right",.902],[" the",.014],[" a",.009],[" wrong",.008]],[" late"," angry"," first"," human"," pizza"]],
["def add(a, b):\n    \"\"\"Return the sum of a and b.\"\"\"\n    return a",[[" +",.934],[" *",.012],[" -",.011],[",",.006]],[" plus"," and"," b"," or"," minus"]],
["Q: What is the capital of France? A: The capital of France is",[[" Paris",.981],[" the",.004],[" located",.002],[" a",.001]],[" Lyon"," Europe"," lovely"," French"," Rome"]],
["Dear hiring manager, I am writing to express my interest in the",[[" position",.412],[" role",.201],[" open",.063],[" Software",.031]],[" money"," job"," company"," future"," snacks"]],
["The waiter returned with a small plate and a smaller apology. Is there anything else I can",[[" get",.402],[" help",.221],[" do",.184],[" bring",.061]],[" eat"," say"," fix"," cook"," offer"]],
["The 3 a.m. commit message said it all: fixed the bug, please don't ask how. git push origin",[[" main",.402],[" master",.331],[" HEAD",.041],[" develop",.022]],[" please"," now"," prod"," yolo"," friday"]],
["The forecast promised sun. By noon the sky was the colour of wet cement and it began to",[[" rain",.812],[" pour",.061],[" snow",.032],[" drizzle",.019]],[" cry"," sing"," clear"," glow"," hail"]],
["User: Summarise this document in one sentence. Assistant: Sure! Here's a one-sentence summary of the",[[" document",.612],[" text",.121],[" article",.083],[" provided",.041]],[" vibes"," meeting"," plot"," book"," thing"]],
["The old lighthouse keeper had one rule, painted above the door. Keep the light",[[" on",.318],[" burning",.191],[" shining",.104],[" lit",.088]],[" off"," clean"," warm"," alive"," beige"]]
];
const $=s=>document.querySelector(s), rc=$('#rc'), c=$('#c'), g=$('#g'), p=$('#p'), r=$('#r'), v=$('#v'), t=$('#t'), bar=$('#bar'), go=$('#go');
const LIMIT=5000; let cur, pick, timer, order=[], i=0;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;'), sp=s=>esc(s).replace(/ /g,'<i>␣</i>').replace(/\n/g,'<i>⏎</i>');
const id=s=>{let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return 1000+h%9000};
const pct=x=>(x*100).toFixed(x<.01?3:1)+'%';
const shuf=a=>{for(let j=a.length-1;j>0;j--){const k=Math.random()*(j+1)|0;[a[j],a[k]]=[a[k],a[j]]}return a};
function render(){
  cur=D[order[i++%D.length]]; pick=null; c.removeAttribute('data-done'); r.removeAttribute('data-show'); v.removeAttribute('data-show'); go.style.visibility='';
  p.innerHTML=cur[0].match(/ ?[\w']+|\s|[^\w\s']/g).map((w,k)=>`<span class="tk" style="background:hsl(${(k*47)%360} 70% 92%)">${sp(w)}</span>`).join('')+'<span class="tk q">?</span>';
  const known=[...cur[1],...cur[2].map(w=>[w,1e-5])].map(([w,pr])=>[w,pr,id(w)]), used=new Set(known.map(k=>k[2])), cells=[...known];
  while(cells.length<160){const n=1000+Math.random()*9000|0; if(!used.has(n)){used.add(n);cells.push(['',0,n])}}
  g.innerHTML=shuf(cells).map(k=>`<button data-w="${esc(k[0])}" data-p="${k[1]}" class="${k[0]?'':'f'}">${k[2]}</button>`).join('');
  g.querySelectorAll('button').forEach(b=>b.onclick=()=>{g.querySelector('.sel')?.classList.remove('sel');b.classList.add('sel');pick=b});
  const t0=performance.now(); clearInterval(timer);
  timer=setInterval(()=>{const f=1-(performance.now()-t0)/LIMIT; bar.style.transform=`scaleX(${Math.max(0,f)})`; t.textContent=Math.max(0,f*LIMIT/1000).toFixed(1); if(f<=0)finish(false)},50);
}
function finish(ok){
  clearInterval(timer); c.setAttribute('data-done',''); go.style.visibility='hidden';
  g.querySelectorAll('button').forEach(b=>{ if(b.dataset.w){b.classList.add('w');b.textContent=b.dataset.w.trim()} if(b.dataset.w===cur[1][0][0])b.classList.add('ok'); else if(b===pick)b.classList.add('no'); });
  if(ok){ v.className='good'; v.innerHTML='<strong>Verified</strong><span>Welcome back.</span>'; v.setAttribute('data-show',''); rc.dataset.s='ok'; $('#box').setAttribute('aria-checked','true'); setTimeout(()=>c.removeAttribute('data-open'),1200); return; }
  const rows=[...cur[1]]; if(pick&&pick.dataset.w&&!rows.some(x=>x[0]===pick.dataset.w))rows.push([pick.dataset.w,+pick.dataset.p]);
  r.innerHTML='<h3>Next-token distribution</h3>'+rows.map(([w,pr])=>`<span>${sp(w)} <i style="color:var(--ink3)">${id(w)}</i></span><span class="b ${pick&&w===pick.dataset.w?'you':''}"><i data-w="${pr/rows[0][1]*100}"></i></span><span class="n">${pct(pr)}</span>`).join('');
  r.setAttribute('data-show',''); requestAnimationFrame(()=>r.querySelectorAll('.b i').forEach(x=>x.style.width=x.dataset.w+'%'));
  v.className='bad'; v.innerHTML='<strong>Verification failed</strong><span>Human detected.</span><a href="#" id="again">Try again</a>'; v.setAttribute('data-show','');
  $('#again').onclick=e=>{e.preventDefault();render()};
}
function start(){ if(rc.dataset.s==='ok')return; order=shuf(D.map((_,k)=>k)); i=0; c.setAttribute('data-open',''); render(); }
$('#box').onclick=$('#lbl').onclick=start; $('#box').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();start()}};
go.onclick=()=>{ if(!pick)return; finish(pick.dataset.w===cur[1][0][0]); };
$('#new').onclick=()=>{ if(c.hasAttribute('data-open')&&rc.dataset.s!=='ok')render(); };
</script>
